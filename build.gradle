plugins {
    id 'fabric-loom' version '1.17.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The upstream LittleTiles 1.20 source is written against Mojang official mappings.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // CreativeCore 2.12.41, Fabric build for Minecraft 1.20.1.
    // Modrinth version ID: 3q9j0cNZ. It is a required dependency and is not bundled.
    modImplementation "maven.modrinth:creativecore:3q9j0cNZ"

    // Temporary Forge API compatibility layer used while porting the upstream source.
    compileOnly 'net.minecraftforge:eventbus:6.0.5'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Sodium 0.5.11 for 1.20.1; the upstream renderer has optional Sodium integration.
    modCompileOnly "maven.modrinth:sodium:ygf8cVZg"
}

loom {
    runs {
        client {
            programArgs '--username', 'Dev'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    api {
        java.srcDir 'src/api/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
}

sourceSets.main.compileClasspath += sourceSets.api.output
sourceSets.main.runtimeClasspath += sourceSets.api.output

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
